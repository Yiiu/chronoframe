packages:
  - .
  - packages/*

overrides:
  sharp: 0.34.5

peerDependencyRules:
  ignoreMissing:
    - "@nuxt/kit"

allowBuilds:
  '@parcel/watcher': true
  # 13.x ships prebuilds (incl. linuxmusl-x64) and loads them at runtime; building
  # from source needs Python + a compiler, which the alpine Docker image lacks.
  better-sqlite3: false
  esbuild: true
  sharp: true
  vue-demi: true
