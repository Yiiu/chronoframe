name: CI

# Catch build/deploy breakage on every push and PR — e.g. a dependency bump
# that breaks `pnpm install` in the alpine image or the production server
# startup — instead of only when a release tag runs Publish Images.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Lint & unit tests
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Unit tests
        run: pnpm test

  docker-smoke:
    name: Docker image build & smoke test
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image (not pushed)
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: chronoframe:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Start container
        run: docker run -d --name chronoframe-ci -p 3000:3000 chronoframe:ci

      - name: Smoke test
        run: bash .github/scripts/smoke.sh http://localhost:3000

      - name: Container logs
        if: always()
        run: docker logs chronoframe-ci || true
